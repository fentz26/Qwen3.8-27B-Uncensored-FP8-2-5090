# Add this under `llm-pi-ai.providers` in $DSH_HOME/settings.yaml (deepseek-harness).
#
# Defaults assume vLLM is running locally (scripts/serve.sh on the same
# host). For a remote deployment, replace baseURL with your own
# http://$HOST:$PORT/v1 and, if you're putting an authenticated proxy in
# front, add an apiKeyEnv referencing a QWEN_API_KEY-style env var whose
# value goes in $DSH_HOME/.credentials.yaml (never in this file).

qwen3-5-27b:
  api: openai-completions
  baseURL: http://127.0.0.1:8000/v1
  models:
    - id: Qwen3.8-27B-Uncensored-FP8
      name: Qwen3.8 27B Uncensored (2x RTX 5090)
      contextWindow: 131072
      maxTokens: 8192
